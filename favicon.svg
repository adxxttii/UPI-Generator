<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base with Indigo-Cyan Gradient -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle Inner Gloss Border -->
  <rect x="34" y="34" width="444" height="444" rx="126" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.35"/>

  <!-- UPI PayFlow Hexagon & Spark Geometry Icon -->
  <g transform="translate(256, 256) scale(14)" stroke="url(#iconGlow)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 -10 L8.66 -5 L8.66 5 L0 10 L-8.66 5 L-8.66 -5 Z"/>
    <path d="M0 -6 V6"/>
    <path d="M-5 -3 L5 3"/>
    <path d="M5 -3 L-5 3"/>
  </g>
</svg>
